[package]
name = "psst-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
psst-core = { path = "../psst-core", features = ["cpal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.1"

reqwest = { version = "0.11", features = ["blocking", "json"] }
open = "5.3.2"

librespot-core = "=0.7.1"
librespot-metadata = "=0.7.1"
librespot-protocol = "=0.7.1"
librespot-oauth = "=0.7.1"
protobuf = "3"
protobuf-json-mapping = "3"

tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "time", "sync"] }
futures = "0.3"
crossbeam-channel = "0.5"

mpris-server = { version = "0.10", features = ["tokio"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# el build.rs de lindera baja el diccionario IPADIC al compilar (necesita red)
lindera = { version = "6.0.0", features = ["embed-ipadic"] }
wana_kana = "5.0.0"
pinyin = "0.11.0"

# misma versión que psst_core::oauth (comparte PkceCodeVerifier)
oauth2 = "4.4.2"
